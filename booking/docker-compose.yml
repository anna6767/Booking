services:
  db:
    image: postgres:16-alpine
    container_name: booking-db
    environment:
      POSTGRES_USER: bookinguser
      POSTGRES_PASSWORD: secretpass
      POSTGRES_DB: bookingdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookinguser"]
      interval: 5s
      retries: 5

  app:
    build: .
    container_name: booking-app
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: bookinguser
      DB_PASSWORD: secretpass
      DB_NAME: bookingdb
      APP_PORT: 8080
    depends_on:
      db:
        condition: service_healthy